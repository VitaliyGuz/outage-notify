<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>График света</title>
<meta name="description" content="График отключений электроэнергии по очередям, Полтавская область">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#edf2f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1a2b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Свет">
<style>
  :root {
    color-scheme: light dark;
    --sky: #edf2f6; --ink: #14253b; --muted: #5a6c81; --line: #cdd8e2; --accent: #c8242b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --sky: #0e1a2b; --ink: #f1ecdf; --muted: #8fa0b5; --line: #26384f; --accent: #ff5d61; }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--sky); color: var(--ink);
    font: 1rem/1.4 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 26rem; margin: 0 auto;
    padding: max(1rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right))
             max(1.5rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; color: var(--muted); }
  header label { display: flex; align-items: center; gap: .5rem; }
  select {
    font: inherit; font-weight: 600; color: var(--ink);
    background: transparent; border: 1px solid var(--line); border-radius: .5rem; padding: .25rem .4rem;
  }

  .status { margin-top: 1.5rem; text-align: center; }
  h1 { font-size: clamp(2rem, 10vw, 2.6rem); line-height: 1.1; font-weight: 700; letter-spacing: -.02em; }
  .status p { margin-top: .3rem; font-size: 1.15rem; }
  #until { font-weight: 600; }
  #left { color: var(--muted); }

  /* A chronograph watch drawn around its centre: the schedule is the ring at the edge of its screen. */
  .watch { position: relative; max-width: 24rem; margin: .4rem auto 0; }
  .dial {
    position: relative; container-type: inline-size;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
    /* The watch is the same dark steel in either theme, its screen always lit on black. */
    --ink: #f4f4f1; --muted: #9aa0a8; --accent: #e8242c;
  }
  .dial:focus-visible { outline: none; }
  .dial:focus-visible .screen { stroke: var(--accent); }
  /* Two discs under the drawing, which is open over them. The bezel's band: brushed steel with the
     streaks of light a turned ring throws. */
  .band, .glass, .gloss {
    position: absolute; top: 50%; left: 50%; aspect-ratio: 1; transform: translate(-50%, -50%);
    border-radius: 50%;
  }
  .band {
    width: 82.6%;
    background:
      repeating-radial-gradient(circle, rgb(255 255 255 / .06) 0 .5px, transparent .5px 2px),
      conic-gradient(from -50deg,
        rgb(255 255 255 / .62), rgb(255 255 255 / .2) 10deg, rgb(255 255 255 / .04) 30deg,
        rgb(0 0 0 / .38) 75deg, rgb(0 0 0 / .16) 120deg, rgb(255 255 255 / .1) 155deg, rgb(255 255 255 / .22) 170deg,
        rgb(255 255 255 / .52) 180deg, rgb(255 255 255 / .16) 190deg, rgb(255 255 255 / .03) 210deg,
        rgb(0 0 0 / .4) 258deg, rgb(0 0 0 / .14) 305deg, rgb(255 255 255 / .18) 350deg, rgb(255 255 255 / .62)),
      linear-gradient(135deg, #6a6e73, #3a3d41 40%, #1f2124 75%, #2d3034);
  }
  /* The same two glints carried out over the cogged ring, which turns under them. */
  .gloss {
    width: 90.6%; pointer-events: none;
    background: conic-gradient(from -50deg,
      rgb(255 255 255 / .5), rgb(255 255 255 / .14) 10deg, transparent 32deg, transparent 155deg,
      rgb(255 255 255 / .16) 170deg, rgb(255 255 255 / .42) 180deg, rgb(255 255 255 / .1) 190deg, transparent 212deg,
      transparent 335deg, rgb(255 255 255 / .14) 350deg, rgb(255 255 255 / .5));
    -webkit-mask: radial-gradient(circle closest-side, transparent 90.6%, #000 91.2%);
    mask: radial-gradient(circle closest-side, transparent 90.6%, #000 91.2%);
  }
  /* The face: a sunburst sheen and finely turned circles, as on a metal dial. */
  .glass {
    width: 70.4%;
    background:
      repeating-radial-gradient(circle, rgb(255 255 255 / .05) 0 1px, transparent 1px 4px),
      radial-gradient(circle, transparent 55%, #000 88%),
      conic-gradient(from -60deg, #4d5157, #0c0d0e 65deg, #0c0d0e 115deg, #4d5157 180deg, #0c0d0e 245deg, #0c0d0e 295deg, #4d5157);
  }
  .dial svg { position: relative; display: block; width: 100%; height: auto; }
  .dial text {
    text-anchor: middle; dominant-baseline: central;
    font-family: "Helvetica Neue", Roboto, "Segoe UI", system-ui, sans-serif;
  }
  .steel { fill: url(#steel); }
  .strap { fill: #17181b; }
  .ribs { fill: url(#ribs); }
  .grooves { stroke: #0c0d0f; stroke-width: 1.2; }
  .case { fill: none; stroke: url(#steel); stroke-width: 23; }
  .edge { fill: none; stroke: #6a6f76; stroke-opacity: .5; }
  /* The cogged ring turns, a click per half-hour; the light on it and the hours engraved inside it stay put. */
  #gear { fill: #50545a; fill-rule: evenodd; }
  .sheen { fill: none; stroke: url(#sheen); stroke-width: 18; }
  #marks path { stroke-width: 2; }
  #marks .lit { stroke: #f4f5f6; }
  #marks .dark { stroke: #0b0c0d; }
  #marks .pip { fill: #fff; stroke: #0e0f11; stroke-width: 1; stroke-linejoin: round; }
  .turns { transition: transform .2s ease-out; }
  /* Let go of, the ring runs back to the default window rather than snapping to it. */
  .returning .turns { transition: transform .7s cubic-bezier(.3, 0, .2, 1); }
  .turning .turns { transition: none; }
  .groove { fill: none; stroke: #0b0c0d; stroke-width: 1.2; }
  #notches path { stroke: #e2e4e6; stroke-opacity: .8; stroke-width: 1.2; stroke-linecap: round; }
  /* Outlined in shadow, as engraving is, so they hold against the streaks of light. */
  #hours text {
    fill: #fff; font-size: 12.5px; font-weight: 500; letter-spacing: .04em;
    paint-order: stroke; stroke: rgb(0 0 0 / .6); stroke-width: 1.4px;
  }
  .screen { fill: none; stroke: #050607; stroke-width: 3; }
  .track { fill: none; stroke: #1a1d21; stroke-width: 8; }
  /* The bezel's grab area. Touches on it turn the bezel; anywhere else on the watch they scroll the page. */
  #grip { fill: none; stroke: transparent; stroke-width: 46; pointer-events: stroke; touch-action: none; cursor: grab; }
  .turning #grip { cursor: grabbing; }
  #ring path { fill: none; stroke-width: 8; }
  #ring .on { stroke: var(--ink); }
  #ring .maybe { stroke: url(#hatch); }
  #ring .past { opacity: .35; }
  .hatch { fill: var(--ink); }
  #seam { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 2 2.5; }
  #cursor { stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; }
  #scale text { fill: var(--ink); font-size: 29px; }
  /* The small dials read by their needles; a press spells the reading out over the face. */
  .sub .face { fill: #050506; stroke: url(#chrome); stroke-width: 4.5; }
  .turned { fill: none; stroke: #fff; stroke-opacity: .08; }
  .ticks path { stroke: #eef0f1; stroke-width: 1.5; }
  .ticks text { fill: #eef0f1; font-size: 8.5px; font-weight: 500; }
  #total-off .ticks text { font-size: 6.5px; }
  .needle, .hub { fill: var(--accent); }
  #total-on .needle { fill: none; stroke: var(--ink); stroke-width: 1.2; stroke-linecap: round; }
  #total-on .hub { fill: #000; stroke: var(--ink); }
  .date rect { fill: #1b1d20; stroke: #a9adb2; stroke-width: .9; }
  #date { fill: var(--ink); font-size: 12.5px; letter-spacing: .03em; }
  .hand .stem { stroke: #a4a8ad; stroke-width: 2.6; stroke-linecap: round; }
  .hand .blade { fill: #fff; stroke: #0e0f11; stroke-width: .8; stroke-linejoin: round; }
  .hand .facet { fill: #c6c9cd; }
  #second-hand { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .pin { fill: var(--accent); }
  .pin-eye { fill: var(--ink); }
  /* One step a second: a sweeping hand would have the whole watch repainted on every frame. */
  .seconds { animation: tick 60s steps(60) var(--tick, 0s) infinite; }
  @keyframes tick { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .turns { transition: none; }
    .seconds { animation: none; }
  }
  #shade { fill: #000; fill-opacity: .86; }
  #mark { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; }
  /* The case's two buttons are drawn with the watch; these are their touch areas. */
  .pusher, .hit {
    position: absolute; aspect-ratio: 1; transform: translate(-50%, -50%);
    padding: 0; border: 0; border-radius: 50%; background: none;
  }
  .pusher { left: 93.7%; width: 13%; }
  #pusher-reset { top: 31.8%; }
  #pusher-refresh { top: 68.2%; }
  /* The small dials are pressed through these, laid over them. */
  .hit { left: 50%; top: 50%; width: 17.2%; }
  #hit-count { top: 39.59%; }
  #hit-off { top: 60.41%; }
  #hit-on { left: 32.55%; }
  .watch:has(#pusher-reset:active) #pusher-top, .watch:has(#pusher-refresh:active) #pusher-bottom { transform: translateY(3px); }

  /* The description of an inspected period, over the shaded face. */
  .tip {
    position: absolute; top: 50%; left: 50%; width: 50%; transform: translate(-50%, -50%);
    text-align: center; text-wrap: balance; color: var(--muted); pointer-events: none;
    font-size: .8rem; font-size: 3.6cqw; line-height: 1.3;
  }
  .tip strong { display: block; font-size: 1.55em; line-height: 1.15; color: var(--ink); }
  .tip .range { font-size: 1.15em; font-weight: 600; color: var(--ink); }

  .window { margin-top: .7rem; text-align: center; color: var(--muted); font-size: .9rem; }
  .legend { display: grid; grid-template-columns: repeat(2, 1fr); gap: .5rem; margin-top: .9rem; }
  .legend button {
    display: flex; flex-direction: column; gap: .15rem; text-align: left;
    padding: .55rem .7rem; border: 1px solid var(--line); border-radius: .75rem; background: none;
  }
  .legend [aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .legend small { color: var(--muted); font-size: .8rem; line-height: 1.25; text-wrap: balance; }
  .legend b { display: flex; align-items: center; gap: .45rem; font-size: 1.15rem; font-weight: 600; }
  .legend i { width: 1.1rem; height: .6rem; border-radius: 2px; background: var(--ink); }
  .legend .off { background: none; border: 1px solid var(--muted); }

  section { margin-top: 1.75rem; }
  h2 { font-size: 1rem; font-weight: 600; color: var(--muted); }
  ol { list-style: none; padding: 0; margin-top: .25rem; }
  li {
    display: grid; grid-template-columns: 1fr auto; column-gap: 1rem;
    padding: .55rem 0; border-bottom: 1px solid var(--line); font-size: 1.15rem;
  }
  li small { grid-column: 1 / -1; color: var(--muted); font-size: .85rem; font-weight: 400; }
  li .dur { color: var(--muted); }
  li.past { color: var(--muted); }
  li.next { font-weight: 700; }
  li.next .dur { color: inherit; }
  .none { margin-top: .5rem; }

  button { font: inherit; color: inherit; cursor: pointer; }
  #notify, #status {
    width: 100%; padding: .8rem 1rem; border: 0; border-radius: 999px;
    background: var(--ink); color: var(--sky); font-weight: 600;
  }
  .switches p { margin-top: .6rem; color: var(--muted); font-size: .9rem; text-align: center; }
  .switches p:empty { display: none; }
  #status { margin-top: 1.25rem; }

  footer {
    margin-top: 1.75rem; display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem;
    color: var(--muted); font-size: .85rem;
  }
  #refresh { background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <label>Очередь <select id="queue"></select></label>
    <time id="day"></time>
  </header>

  <div class="status" aria-live="polite">
    <h1 id="state">Загружаю график</h1>
    <p><span id="until"></span> <span id="left"></span></p>
  </div>

  <div class="watch">
    <div class="dial" id="dial" role="slider" tabindex="0" aria-label="Диапазон на циферблате">
      <div class="band"></div>
      <div class="glass"></div>
      <svg viewBox="-192 -245 384 490" aria-hidden="true">
        <defs>
          <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect class="hatch" width="1.6" height="4"/>
          </pattern>
          <pattern id="ribs" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
            <rect width="7" height="2.4" fill="#2b2d31"/>
          </pattern>
          <linearGradient id="steel" x2="1" y2="1">
            <stop stop-color="#5a5e64"/><stop offset=".3" stop-color="#2c2f33"/>
            <stop offset=".55" stop-color="#3d4146"/><stop offset="1" stop-color="#17191c"/>
          </linearGradient>
          <linearGradient id="sheen" x2="1" y2="1">
            <stop stop-color="#fff" stop-opacity=".3"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
            <stop offset="1" stop-color="#000" stop-opacity=".4"/>
          </linearGradient>
          <linearGradient id="chrome" x2="1" y2="1">
            <stop stop-color="#b9bcc0"/><stop offset="1" stop-color="#4a4d51"/>
          </linearGradient>
          <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="-245" x2="0" y2="-226">
            <stop stop-color="#000"/><stop offset="1" stop-color="#fff"/>
          </linearGradient>
          <mask id="strap-fade" maskUnits="userSpaceOnUse" x="-87" y="-245" width="174" height="87">
            <rect x="-87" y="-245" width="174" height="87" fill="url(#fade)"/>
          </mask>
          <g id="strap">
            <path class="steel" d="M-150 -84.2Q-128 -150 -117 -205Q-116 -214 -107 -214H107Q116 -214 117 -205Q128 -150 150 -84.2A172 172 0 0 0 -150 -84.2Z"/>
            <g mask="url(#strap-fade)">
              <rect class="strap" x="-87" y="-245" width="174" height="87"/>
              <rect class="ribs" x="-71" y="-245" width="142" height="87"/>
            </g>
          </g>
        </defs>
        <use href="#strap"/>
        <use href="#strap" transform="scale(1 -1)"/>
        <path class="steel" d="M171 -49Q200 0 171 49Z"/>
        <g transform="rotate(62)">
          <g id="pusher-top"><rect class="steel" x="-19" y="-187" width="38" height="14" rx="2.5"/><path class="grooves" d="M-12 -186.5V-181M-6 -186.5V-181M0 -186.5V-181M6 -186.5V-181M12 -186.5V-181"/></g>
        </g>
        <g transform="rotate(118)">
          <g id="pusher-bottom"><rect class="steel" x="-19" y="-187" width="38" height="14" rx="2.5"/><path class="grooves" d="M-12 -186.5V-181M-6 -186.5V-181M0 -186.5V-181M6 -186.5V-181M12 -186.5V-181"/></g>
        </g>
        <circle class="case" r="168.5"/>
        <circle class="edge" r="179.5"/>
        <g class="turns" id="bezel"><path id="gear"/></g>
        <circle class="sheen" r="166"/>
        <g class="turns" id="marks"><path class="pip" d="M0 -159L-8 -173H8Z"/></g>
        <circle class="groove" r="158"/>
        <g id="notches"></g>
        <g id="hours"></g>
        <circle class="screen" r="135"/>
        <circle class="track" r="127"/>
        <g id="ring"></g>
        <path id="seam" d="M0 -122V-132" hidden/>
        <path id="cursor" d="M0 -120V-133" hidden/>
        <g id="scale"></g>
        <g class="sub" id="count" transform="translate(0 -51)">
          <circle class="face" r="31"/><g class="ticks"></g><path class="needle" d="M-1.7 4L0 -22L1.7 4Z"/><circle class="hub" r="3"/>
        </g>
        <g class="sub" id="total-on" transform="translate(-67 0)">
          <circle class="turned" r="27"/><circle class="turned" r="20"/><circle class="turned" r="13"/>
          <g class="ticks"></g><path class="needle" d="M0 6V-21"/><circle class="hub" r="2.2"/>
        </g>
        <g class="sub" id="total-off" transform="translate(0 51)">
          <circle class="face" r="31"/><g class="ticks"></g><path class="needle" d="M-1.7 4L0 -22L1.7 4Z"/><circle class="hub" r="3"/>
        </g>
        <g class="date"><rect x="27" y="-10" width="58" height="20" rx="1.5"/><text id="date" x="56" y=".5"></text></g>
        <g class="hand" id="hour-hand">

          <path class="blade" d="M-4.4 -16V-57L0 -70L4.4 -57V-16Z"/>
          <path class="facet" d="M0 -16V-70L4.4 -57V-16Z"/>
        </g>
        <g class="hand" id="minute-hand">
          <path class="stem" d="M0 12V-24"/>
          <path class="blade" d="M-3.4 -22V-98L0 -110L3.4 -98V-22Z"/>
          <path class="facet" d="M0 -22V-110L3.4 -98V-22Z"/>
        </g>
        <g class="seconds" id="second-hand"><path d="M0 24V-126M0 -100L3.2 -92L0 -84L-3.2 -92Z"/></g>
        <circle class="pin" r="5"/><circle class="pin-eye" r="2.2"/>
        <circle id="shade" r="121.5" hidden/>
        <path id="mark" hidden/>
        <circle id="grip" r="157"/>
      </svg>
      <div class="gloss"></div>
      <div class="tip" id="tip" hidden>
        <strong></strong>
        <p class="range"></p>
        <p></p>
        <p></p>
      </div>
    </div>
    <button class="pusher" id="pusher-reset" type="button" aria-label="Сбросить диапазон" title="Сбросить диапазон"></button>
    <button class="pusher" id="pusher-refresh" type="button" aria-label="Обновить график" title="Обновить график"></button>
    <button class="hit" id="hit-count" type="button" aria-label="Сколько до включения света"></button>
    <button class="hit" id="hit-on" type="button" aria-label="Со светом сегодня: цифры и список"></button>
    <button class="hit" id="hit-off" type="button" aria-label="Без света сегодня: цифры и список"></button>
  </div>
  <p class="window" id="window"></p>
  <div class="legend" id="legend">
    <button type="button" data-state="1"><b><i></i><span></span></b><small>со светом</small></button>
    <button type="button" data-state="2"><b><i class="off"></i><span></span></b><small>без света</small></button>
  </div>

  <section id="today" hidden>
    <h2></h2>
    <ol></ol>
  </section>
  <section id="tomorrow" hidden>
    <h2></h2>
    <ol></ol>
  </section>

  <section class="switches">
    <button id="notify" type="button" hidden></button>
    <p id="notify-hint"></p>
    <button id="status" type="button" hidden></button>
    <p id="status-hint"></p>
  </section>

  <footer>
    <p id="source"></p>
    <button id="refresh" type="button">Обновить</button>
  </footer>
</main>

<script src="schedule.js"></script>
<script>
// The status push: the public half of the key pair it is signed with, and the worker that keeps the
// list of devices to nudge (worker/).
const VAPID_PUBLIC_KEY = 'BF5-2NY2Un22wD8YqqqAabhGnaqdK_Sk1XVRjV-ieRhI13UnxteOVpwOKYbF8JRmwVJLE3ifQpRU1EAxqDAsUQU';
const PUSH_API = 'https://outage-notify.vitaliy-guz.workers.dev';
const WINDOW = 24, LEAD_MIN = 15, REFRESH_MS = 10 * 60e3;

const $ = id => document.getElementById(id);
const mod = (n, m) => ((n % m) + m) % m;

// The service worker cannot read localStorage, so what it needs is also left in the cache it can read.
const SHARED = ['queue', 'schedule'];
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    if (SHARED.includes(key) && 'caches' in window) prefsPut(key, value).catch(() => {});
  },
};

const dayLabel = new Intl.DateTimeFormat('ru', {timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long'});
const timeLabel = new Intl.DateTimeFormat('ru', {timeZone: TZ, hour: '2-digit', minute: '2-digit'});
const dateLabel = new Intl.DateTimeFormat('ru', {timeZone: TZ, weekday: 'short', day: 'numeric'});

// Half-hour states on one axis counted from today's midnight (-48..-1 yesterday, 48..95 tomorrow);
// undefined where no schedule is known.
function timeline(days, today) {
  const around = [-1, 0, 1].map(shift => days[shiftDate(today, shift)]);
  return slot => around[Math.floor(slot / SLOTS) + 1]?.[mod(slot, SLOTS)];
}

// The 12-hour window opens at the last switch between power and outage; with no switch in the last
// 12 hours it opens at the current hour. A window that would run into a tomorrow not published yet
// is the second half of today instead.
function windowStart(at, slot) {
  const on = lit(at(slot));
  let start = slot;
  while (slot - start < WINDOW && at(start - 1) !== undefined && lit(at(start - 1)) === on) start--;
  if (slot - start >= WINDOW) start = slot - slot % 2;
  return at(start + WINDOW - 1) === undefined ? SLOTS - WINDOW : start;

      // An outage running over midnight was announced the day before, if that day's schedule is known.
      if (iso === tomorrow && o.start === 0 && days[now.date]?.at(-1) === OFF) continue;
      const wait = offset + o.start * 30 - now.minutes;
      if (wait <= 0 || wait > LEAD_MIN) continue;
      const tail = o.late > o.end ? ` Включение может задержаться до ${hhmm(o.late)}.` : '';

        key: `${queue} ${iso} ${hhmm(o.start)}`,
        title: `Через ${wait} мин отключение света`,

const turning = document.querySelectorAll('.turns');

const LISTS = {

// A day's stretches of power (the switching half-hours counted with it) or of none.

  const periods = [];
  for (let i = 0; i < cells.length; i++) {
    if (!same(cells[i])) continue;
    const start = i;
    while (same(cells[i + 1])) i++;

}

// The day's stretches of one state, under a heading that names the state and the day.
function listPeriods(section, day, cells, slot, state) {
  const periods = runs(cells, state);
  const active = periods.find(p => slot < p.end);
  section.querySelector('h2').textContent = `${LISTS[state].title} ${day}`;
  const list = section.querySelector('ol');
  list.replaceChildren(...periods.map(p => {
    const li = el('li', {className: slot >= p.end ? 'past' : p === active && slot >= 0 ? 'next' : ''});
    li.append(el('span', {textContent: `${hhmm(p.start)} – ${hhmm(p.end)}`}),
              el('span', {className: 'dur', textContent: span((p.end - p.start) * 30)}));
    // The switching half-hours come after an outage's end and open the power after it.
    const edge = state === OFF ? p.end : p.start;
    let late = edge;
    while (cells[late] === MAYBE) late++;
    if (late > edge) li.append(el('small', {textContent: `включение может задержаться до ${hhmm(late)}`}));

let queue = store.get('queue', DEFAULT_QUEUE);
let shown = store.get('list', OFF);
if (!LISTS[shown]) shown = OFF;
let data = store.get('schedule', null);
let loading = false;
let failed = false;
let probe = null;
// What is spelled out over the face instead: a state, for its figures for today, or RETURN, for the
// time left until the power is back.

// The window start the bezel was turned to, with the day it was counted from; null while the dial
// shows the default window.
let pinned = null;
// The bezel while it is dragged: the pointer's last angle and the turn so far, in clicks.
let grip = null;
// Until the bezel has been turned once on this device, it shows on opening that it turns.
let turned = store.get('turned', false);
let hinted = false;

  const words = state => cells ? `${hours(state).toLocaleString('ru')} ч` : '';

  }

function render() {
  const now = kyivNow();
  const days = queueDays();
  const cells = days[now.date];
  const slot = Math.floor(now.minutes / 30);
  $('day').textContent = dayLabel.format(new Date());

  renderDial(now, days);
  hintBezel();
  renderTotals(cells);

  const [state, until, left] = cells ? status(cells, now.minutes)
    : loading ? ['Загружаю график', '', '']
    : !data ? ['График не загрузился', 'Проверьте интернет', 'и нажмите «Обновить»']
    : ['Графика на сегодня нет', failed ? 'нет связи с источником' : 'источник его не публикует', ''];
  $('state').textContent = state;
  $('until').textContent = until;
  $('left').textContent = left;

  $('today').hidden = !cells;
  if (cells) listPeriods($('today'), 'сегодня', cells, slot, shown);
  const tomorrow = days[shiftDate(now.date, 1)];
  $('tomorrow').hidden = !tomorrow;
  if (tomorrow) listPeriods($('tomorrow'), 'завтра', tomorrow, -1, shown);

    : (loading ? 'Обновляю… ' : failed ? 'Нет связи с источником. ' : '')
      + (data.updated ? `Полтаваоблэнерго обновил график ${data.updated}. ` : 'Источник: Полтаваоблэнерго. ')
      + `Загружен в ${timeLabel.format(data.fetchedAt)}.`;
}

// The cached copy stays on screen while the request runs and is replaced only by a good answer.
async function load() {
  if (loading) return;
  loading = true;
  render();
  try {
    const fresh = await fetchSchedule();
    // Yesterday is kept so a state that began before midnight still has its start.
    const yesterday = shiftDate(kyivNow().date, -1);
    const kept = data?.days[yesterday] ? {[yesterday]: data.days[yesterday]} : {};
    data = {...fresh, days: {...kept, ...fresh.days}};
    store.set('schedule', data);
    failed = false;
  } catch (e) {
    console.warn('schedule not loaded:', e);
    failed = true;
  }
  loading = false;
  update();
}

// The page and both kinds of notification, brought in line with the clock and the schedule.
function update() {
  render();
  notifyIfDue();
  showStatus();
}

const canNotify = 'Notification' in window && 'serviceWorker' in navigator;
const isIos = /iPhone|iPad|iPod/.test(navigator.userAgent);
const notifyOn = () => canNotify && Notification.permission === 'granted' && store.get('notify', false);

let pushFailed = false;
let statusShown = '';

function renderNotify() {
  const blocked = canNotify && Notification.permission === 'denied';
  $('notify').hidden = !canNotify || blocked;
  $('notify').textContent = notifyOn() ? 'Выключить уведомления' : 'Включить уведомления';
  $('notify-hint').textContent =
    blocked ? 'Уведомления запрещены. Разрешите их для этого сайта в настройках браузера.'
    : canNotify ? `Напомним за ${LEAD_MIN} минут до отключения, пока приложение открыто.`
    : isIos ? 'На iPhone сначала добавьте страницу на экран «Домой», потом включите уведомления здесь.'
    : 'Этот браузер не показывает уведомления.';

  $('status').hidden = !canPush || blocked;
  $('status').textContent = statusOn() ? 'Убрать статус из шторки' : 'Показывать статус в шторке';
  $('status-hint').textContent = !canPush || blocked ? ''
    : pushFailed ? 'Не получилось подписаться на обновления. Проверьте интернет и попробуйте ещё раз.'
    : statusOn() ? 'Статус обновляется сам, даже когда приложение закрыто.'
    : 'Постоянное уведомление: есть ли свет и до скольки.';
}

// Puts this device on the worker's list of devices to nudge, or takes it off.
async function enlist(subscription, on) {
  const response = await fetch(`${PUSH_API}/${on ? 'subscribe' : 'unsubscribe'}`, {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({endpoint: subscription.endpoint}),
  });
  if (!response.ok) throw new Error(`${PUSH_API}: HTTP ${response.status}`);
}
const enlistDevice = async registration => enlist(
  await registration.pushManager.getSubscription()
    ?? await registration.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: VAPID_PUBLIC_KEY}),
  true);

// The status notification is replaced only when its text changes, so one swiped away stays away
// until then (or until the next push).
async function showStatus() {
  if (!statusOn() || !data) return;
  const notice = statusNotice(queueDays(), kyivNow());
  const text = `${queue} ${notice.title} ${notice.body}`;
  if (text === statusShown) return;
  statusShown = text;
  const registration = await navigator.serviceWorker.ready;
  await registration.showNotification(notice.title, statusOptions(notice));
}

async function notifyIfDue() {
  if (!notifyOn() || !data) return;
  const alert = dueAlert(queueDays(), kyivNow(), queue);
  if (!alert || store.get('notified') === alert.key) return;
  const registration = await navigator.serviceWorker.ready;
  await registration.showNotification(alert.title, {body: alert.body, tag: alert.key, icon: 'icon-192.png'});
  store.set('notified', alert.key);
}

$('notify').addEventListener('click', async () => {
  if (notifyOn()) store.set('notify', false);
  else if (await Notification.requestPermission() === 'granted') store.set('notify', true);
  renderNotify();
  notifyIfDue();
});
$('status').addEventListener('click', async () => {
  const registration = await navigator.serviceWorker.ready;
  pushFailed = false;
  if (statusOn()) {
    store.set('status', false);
    statusShown = '';
    for (const posted of await registration.getNotifications({tag: STATUS_TAG})) posted.close();
    const subscription = await registration.pushManager.getSubscription();
    // Cancelled in the browser first: should the worker miss the request, its next nudge is refused
    // and it drops the device itself.
    await subscription?.unsubscribe();
    if (subscription) enlist(subscription, false).catch(e => console.warn('status push:', e));
  } else if (await Notification.requestPermission() === 'granted') {
    try {
      await enlistDevice(registration);
      store.set('status', true);
    } catch (e) {
      console.warn('status push:', e);
      pushFailed = true;
    }
  }
  renderNotify();
  showStatus();
});
// A press on the bezel takes hold of it, and the window it is turned to lasts while it is held;
// anywhere else on the watch a mouse inspects while it hovers, and a tap stays until the next tap
// elsewhere.
$('dial').addEventListener('pointerdown', e => {
  const {r, deg} = polar(e);
  if (!onBezel(r) || !view) return probeAt(e);
  grip = {deg, turn: view.start};
  $('dial').setPointerCapture(e.pointerId);
  $('dial').classList.add('turning');
  $('dial').classList.remove('returning');
  probe = tally = null;
  renderProbe();
});
$('dial').addEventListener('pointermove', e => {
  if (!grip) return probeAt(e);
  if (!view) return;
  const {deg} = polar(e);
  // The bezel follows the finger between clicks, gives a third of a click past either end of the
  // schedule and stops there.
  const turn = grip.turn + (mod(deg - grip.deg + 180, 360) - 180) / 15;
  grip = {deg, turn: Math.min(Math.max(turn, view.min - .35), view.max + .35)};
  setBezel(grip.turn);
  turnTo(Math.round(grip.turn));
});
for (const type of ['pointerup', 'pointercancel']) {
  $('dial').addEventListener(type, () => {
    if (!grip) return;
    grip = null;
    $('dial').classList.remove('turning');
    resetWindow();
  });
}
// Where touch-action is not honoured on a part of a drawing, this keeps the page from scrolling under a turn.
$('grip').addEventListener('touchstart', e => e.preventDefault(), {passive: false});
// The wheel turns the bezel only over the bezel itself; over the screen it scrolls the page as usual.
let spin = 0;
$('dial').addEventListener('wheel', e => {
  if (!view || !onBezel(polar(e).r)) return;
  e.preventDefault();
  spin += e.deltaY;
  if (Math.abs(spin) < 40) return;
  turnBriefly(Math.sign(spin));
  spin = 0;
}, {passive: false});
$('dial').addEventListener('keydown', e => {
  const step = {ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1}[e.key];
  if (!view || !step && e.key !== 'Home') return;
  e.preventDefault();
  if (step) turnBriefly(step);
  else resetWindow();
});
$('pusher-reset').addEventListener('click', resetWindow);
// The small dials: the countdown spells out how long until the power is back; a total spells out
// the day's figures for its state and picks that state's list under the watch.
$('hit-count').addEventListener('click', () => { if (view) setProbe(null, RETURN); });
for (const [id, state] of [['hit-on', ON], ['hit-off', OFF]]) {
  $(id).addEventListener('click', () => {
    choose(state);
    setProbe(null, state);
  });
}
$('dial').addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') setProbe(null); });
document.addEventListener('pointerdown', e => { if (!$('dial').contains(e.target)) setProbe(null); });
$('legend').addEventListener('click', e => {
  const card = e.target.closest('button');
  if (card) choose(card.dataset.state);
});
for (const id of ['refresh', 'pusher-refresh']) $(id).addEventListener('click', load);
$('queue').addEventListener('change', e => {
  queue = e.target.value;
  store.set('queue', queue);
  update();
  if (!data || failed) load();
});
// Coming back to the page reloads the schedule unless it was loaded within the last minute.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (!data || failed || Date.now() - data.fetchedAt > 60e3) load();
  else update();
});

for (const q of QUEUES) $('queue').add(new Option(q, q, false, q === queue));
buildDial();
renderNotify();
store.set('queue', queue);
load();
// Nothing on the page changes more often than the minute does, so it is redrawn as each one starts.
(function tick() {
  setTimeout(() => { try { update(); } finally { tick(); } }, 60e3 - Date.now() % 60e3 + 50);
})();
// A hidden page keeps the schedule fresh only for the notifications it is responsible for.
setInterval(() => { if (!document.hidden || notifyOn() || statusOn()) load(); }, REFRESH_MS);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
// A device that shows the status enlists again on every start, in case the worker has dropped it.
if (statusOn()) navigator.serviceWorker.ready.then(enlistDevice).catch(e => console.warn('status push:', e));
</script>
</body>
</html>
