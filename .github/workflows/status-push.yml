name: Status push

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: status-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: push/requirements.txt
      - run: pip install -r push/requirements.txt
      - run: python push/send_status.py
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
      # GitHub switches a schedule off after 60 days without a commit; enabling the workflow again
      # once a week counts as activity and keeps it running.
      - if: github.event.schedule == '17 3 * * 1'
        run: gh workflow enable status-push.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
