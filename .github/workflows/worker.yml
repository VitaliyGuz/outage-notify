name: Worker

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and each one finished: a cancelled upload could leave the worker half set.
concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # First the database, so that the code never runs against a table it does not know.
      - name: Apply database migrations
        working-directory: worker
        run: npx --yes wrangler@4 d1 migrations apply outage-notify --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The worker's secret (VAPID_PRIVATE_KEY) lives in Cloudflare and is not touched by a deploy.
      - name: Deploy
        working-directory: worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
